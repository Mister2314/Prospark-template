<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Prospark services: ads design, data analytics, SEO, email and content marketing. A React 19 + Vite service page template."
    />
    <title>Services | Prospark Marketing Agency Template</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Heebo:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        var t = null;
        try { t = localStorage.getItem("prospark-theme"); } catch (e) {}
        if (t !== "dark" && t !== "light") {
          t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = t;
      })();
      if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main-service.tsx"></script>
  </body>
</html>
